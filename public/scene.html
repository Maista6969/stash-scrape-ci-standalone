<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrape result</title>
  <link rel="stylesheet" href="/assets/stashbox.css">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="scene">
  <script src="/assets/topbar.js"></script>
  <!-- mirrors a StashDB scene page: info card, tab strip, description pane with tags and a link row -->
  <main class="MainContent container-fluid">
    <div class="NarrowPage">
      <div class="scrape-meta">
        <span>Job <a id="job-id"></a></span>
        <span>Scraper <span id="scrape-id"></span><a id="scraper-hash" class="text-secondary"></a></span>
        <span>Stash <span id="runner-version"></span><span id="runner-hash" class="text-secondary"></span></span>
        <span>Scraped <span id="runner-date"></span></span>
        <span class="d-none">Type <span id="scrape-type">scene</span></span>
      </div>

      <div id="error-box" class="alert alert-danger hidden">
        <p id="error-text" class="error-message mb-0"></p>
      </div>

      <div class="scene-info card">
        <div class="card-header">
          <h3 id="result-title">Scene</h3>
          <h6 id="result-studio"></h6>
        </div>
        <div class="ScenePhoto card-body" id="result-image-container">
          <div class="Image" style="aspect-ratio: 16 / 9">
            <div id="result-image-placeholder">Click to show image</div>
            <img id="result-image" class="Image-image hidden" alt="">
          </div>
        </div>
        <div class="d-flex mx-1 card-footer">
          <div class="scene-performers me-auto" id="result-performers"></div>
          <div class="ms-3" data-optional>Studio Code: <strong id="result-code"></strong></div>
          <div class="ms-3" data-optional>Duration: <b id="result-duration"></b></div>
          <div class="ms-3" data-optional>Director: <strong id="result-director"></strong></div>
        </div>
      </div>

      <ul class="nav nav-tabs" id="scene-tabs" role="tablist">
        <li class="nav-item" role="presentation"><button type="button" class="nav-link active" data-tab="description" role="tab">Description</button></li>
        <li class="nav-item" role="presentation"><button type="button" class="nav-link" data-tab="links" role="tab">Links</button></li>
        <li class="nav-item" role="presentation"><button type="button" class="nav-link" data-tab="log" role="tab">Scrape log</button></li>
      </ul>
      <div class="tab-content">
        <div id="tab-description" class="tab-pane active my-4" role="tabpanel">
          <div class="scene-description"><h4>Description:</h4><div id="result-details">No description</div></div>
          <div class="scene-tags">
            <h6>Tags:</h6>
            <span id="tag-placeholder" class="hint">No tags</span>
            <ul id="tag-list" class="scene-tag-list"></ul>
          </div>
          <div class="scene-tags">
            <h6>Groups:</h6>
            <div id="result-groups" class="scene-tag-list"><span id="group-placeholder" class="hint">No groups</span></div>
          </div>
          <hr>
          <div><b class="me-2">Source:</b><a id="scrape-url"></a></div>
        </div>
        <div id="tab-links" class="tab-pane my-4" role="tabpanel">
          <ul id="result-urls" class="url-list">
            <li id="url-placeholder" class="hint">No URLs</li>
          </ul>
        </div>
        <div id="tab-log" class="tab-pane my-4" role="tabpanel">
          <div id="logs" class="logs"></div>
        </div>
      </div>
    </div>
  </main>
  <script src="/assets/replace.js"></script>
  <script src="/assets/shared.js"></script>
  <script src="/assets/scene.js"></script>
  <script src="/assets/init.js"></script>
</body>
</html>

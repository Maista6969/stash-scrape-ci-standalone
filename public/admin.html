<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>API keys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body data-page="admin" data-key>
    <script src="/assets/topbar.js"></script>
    <main>
      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-label">API keys</h2>
          <div class="panel-tools">
            <form id="create-form" class="d-flex gap-1">
              <input id="create-note" type="text" placeholder="Note or username" class="form-control form-control-sm" style="width: 16rem" required autocomplete="off" />
              <input id="create-limit" type="number" placeholder="Daily limit" class="form-control form-control-sm" style="width: 7rem" min="1" />
              <button type="submit" class="btn btn-sm btn-primary text-nowrap">Create key</button>
            </form>
            <button id="refresh-keys" class="btn btn-sm btn-outline-secondary">Refresh</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Note</th>
                <th>Key</th>
                <th>Status</th>
                <th>Daily limit</th>
                <th>Today</th>
                <th>Total</th>
                <th>Created</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="key-table-body">
              <tr><td colspan="8" class="hint">Enter the admin key to load.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-label">Recent scrapes</h2>
          <button id="refresh-scrapes" class="btn btn-sm btn-outline-secondary">Refresh</button>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Title</th>
                <th>Type</th>
                <th>URL</th>
                <th>Date</th>
                <th>Job</th>
              </tr>
            </thead>
            <tbody id="scrape-table-body">
              <tr><td colspan="5" class="hint">Enter the admin key to load.</td></tr>
            </tbody>
          </table>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 class="panel-label">Installed scrapers</h2>
          <div class="panel-tools">
            <div class="input-group input-group-sm" style="width: 280px">
              <input id="install-scraper-id" type="text" placeholder="Package id, e.g. Altwolia" class="form-control" autocomplete="off" />
              <button id="install-scraper" class="btn btn-primary">Install</button>
            </div>
            <button id="refresh-scrapers" class="btn btn-sm btn-outline-secondary">Refresh</button>
          </div>
        </div>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th>Package</th>
                <th>Version</th>
                <th title="Release date of the installed version, per the CommunityScrapers index; Stash doesn't track when a package was installed here">Package date</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="scraper-table-body">
              <tr><td colspan="4" class="hint">Enter the admin key to load.</td></tr>
            </tbody>
          </table>
        </div>
      </section>
    </main>

    <script>
      const baseURL = window.location.origin;
      const apiURL = `${baseURL}/api/admin/apikey`;
      const scrapesURL = `${baseURL}/api/admin/scrapes`;
      const scrapersURL = `${baseURL}/api/admin/scrapers`;
      const scraperURL = `${baseURL}/api/admin/scraper`;

      const authInput = document.getElementById("admin-auth");
      const tableBody = document.getElementById("key-table-body");
      const scrapeTableBody = document.getElementById("scrape-table-body");
      const scraperTableBody = document.getElementById("scraper-table-body");
      const outdated = (s) => !!s.source_package && s.source_package.version !== s.version;
      // outdated packages sort first, but each row keeps the rank it had when first seen so an
      // update shows in place instead of jumping down the list, until the page is reloaded
      const scraperRank = new Map();

      document.addEventListener("DOMContentLoaded", () => {
        const storedAuth = localStorage.getItem("auth");
        if (storedAuth) {
          authInput.value = storedAuth;
          loadKeys();
          loadScrapes();
          loadScrapers();
        }

        document.getElementById("key-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const auth = authInput.value.trim();
          if (!auth) {
            alert("Admin key is required.");
            return;
          }
          localStorage.setItem("auth", auth);
          loadKeys();
          loadScrapes();
          loadScrapers();
        });

        document
          .getElementById("refresh-keys")
          .addEventListener("click", loadKeys);
        document
          .getElementById("refresh-scrapes")
          .addEventListener("click", loadScrapes);
        document
          .getElementById("refresh-scrapers")
          .addEventListener("click", loadScrapers);
        document
          .getElementById("install-scraper")
          .addEventListener("click", installScraper);
        document
          .getElementById("install-scraper-id")
          .addEventListener("keydown", (event) => {
            if (event.key === "Enter") installScraper();
          });

        document
          .getElementById("create-form")
          .addEventListener("submit", (event) => {
            event.preventDefault();
            createKey();
          });
      });

      function getAuth() {
        return authInput.value.trim() || localStorage.getItem("auth");
      }

      function loadKeys() {
        const auth = getAuth();
        if (!auth) {
          alert("Admin key is required.");
          return;
        }
        fetch(`${apiURL}?auth=${encodeURIComponent(auth)}`)
          .then((res) => {
            if (!res.ok)
              throw new Error("Failed to load API keys. Check your admin key.");
            return res.json();
          })
          .then(renderKeys)
          .catch((err) => alert(err.message));
      }

      function renderKeys(keys) {
        tableBody.innerHTML = "";
        if (!keys.length) {
          tableBody.innerHTML =
            '<tr><td colspan="8" class="text-secondary">No API keys yet.</td></tr>';
          return;
        }
        for (const key of keys) {
          const row = document.createElement("tr");

          const noteCell = document.createElement("td");
          noteCell.textContent = key.note;
          row.appendChild(noteCell);

          const keyCell = document.createElement("td");
          keyCell.className = "apikey-cell";
          keyCell.textContent = key.apikey;
          keyCell.title = "Click to copy";
          keyCell.addEventListener("click", () => {
            navigator.clipboard.writeText(key.apikey);
          });
          row.appendChild(keyCell);

          const statusCell = document.createElement("td");
          const statusBadge = document.createElement("span");
          if (key.active) {
            statusBadge.className = "badge text-bg-success";
            statusBadge.textContent = "Active";
          } else {
            statusBadge.className = "badge text-bg-danger";
            statusBadge.textContent = "Revoked";
            statusBadge.title = formatDate(key.revokedAt);
          }
          statusCell.appendChild(statusBadge);
          row.appendChild(statusCell);

          const limitCell = document.createElement("td");
          limitCell.textContent = key.limit;
          row.appendChild(limitCell);

          const todayCell = document.createElement("td");
          todayCell.textContent = `${key.today} / ${key.limit}`;
          if (key.today >= key.limit)
            todayCell.classList.add("usage-exhausted");
          row.appendChild(todayCell);

          const totalCell = document.createElement("td");
          totalCell.textContent = key.total;
          row.appendChild(totalCell);

          const createdCell = document.createElement("td");
          createdCell.textContent = formatDate(key.createdAt);
          row.appendChild(createdCell);

          const actionCell = document.createElement("td");
          const actionBtn = document.createElement("button");
          if (key.active) {
            actionBtn.className = "btn btn-sm btn-outline-danger";
            actionBtn.textContent = "Revoke";
            actionBtn.addEventListener("click", () =>
              revokeKey(key.apikey, key.note),
            );
          } else {
            actionBtn.className = "btn btn-sm btn-outline-secondary";
            actionBtn.textContent = "Reactivate";
            actionBtn.addEventListener("click", () =>
              reactivateKey(key.apikey, key.note),
            );
          }
          actionCell.appendChild(actionBtn);
          row.appendChild(actionCell);

          tableBody.appendChild(row);
        }
      }

      function loadScrapes() {
        const auth = getAuth();
        if (!auth) return;
        fetch(`${scrapesURL}?auth=${encodeURIComponent(auth)}`)
          .then((res) => {
            if (!res.ok)
              throw new Error(
                "Failed to load recent scrapes. Check your admin key.",
              );
            return res.json();
          })
          .then(renderScrapes)
          .catch((err) => alert(err.message));
      }

      function renderScrapes(scrapes) {
        scrapeTableBody.innerHTML = "";
        if (!scrapes.length) {
          scrapeTableBody.innerHTML =
            '<tr><td colspan="5" class="text-secondary">No scrapes yet.</td></tr>';
          return;
        }
        for (const scrape of scrapes) {
          const row = document.createElement("tr");

          const titleCell = document.createElement("td");
          titleCell.textContent = scrape.title || "(untitled)";
          row.appendChild(titleCell);

          const typeCell = document.createElement("td");
          typeCell.textContent = scrape.scrapeType || "";
          row.appendChild(typeCell);

          const urlCell = document.createElement("td");
          const urlLink = document.createElement("a");
          urlLink.href = scrape.url;
          urlLink.textContent = scrape.url;
          urlLink.target = "_blank";
          urlLink.rel = "noopener noreferrer";
          urlLink.className = "text-truncate d-inline-block";
          urlLink.style.maxWidth = "300px";
          urlCell.appendChild(urlLink);
          row.appendChild(urlCell);

          const dateCell = document.createElement("td");
          dateCell.textContent = formatDate(scrape.date);
          row.appendChild(dateCell);

          const jobIdCell = document.createElement("td");
          const jobIdLink = document.createElement("a");
          jobIdLink.href = `${baseURL}/${scrape.scrapeType}?id=${scrape.jobId}`;
          jobIdLink.textContent = scrape.jobId;
          jobIdLink.target = "_blank";
          jobIdLink.rel = "noopener noreferrer";
          jobIdCell.appendChild(jobIdLink);
          row.appendChild(jobIdCell);

          scrapeTableBody.appendChild(row);
        }
      }

      function loadScrapers() {
        const auth = getAuth();
        if (!auth) return;
        fetch(`${scrapersURL}?auth=${encodeURIComponent(auth)}`)
          .then((res) => {
            if (!res.ok)
              throw new Error(
                "Failed to load installed scrapers. Check your admin key.",
              );
            return res.json();
          })
          .then(renderScrapers)
          .catch((err) => alert(err.message));
      }

      function renderScrapers(scrapers) {
        scraperTableBody.innerHTML = "";
        if (!scrapers.length) {
          scraperTableBody.innerHTML =
            '<tr><td colspan="4" class="text-secondary">No scrapers installed.</td></tr>';
          return;
        }
        for (const s of scrapers) if (!scraperRank.has(s.package_id)) scraperRank.set(s.package_id, outdated(s) ? 0 : 1);
        scrapers.sort((a, b) =>
          scraperRank.get(a.package_id) - scraperRank.get(b.package_id) || a.package_id.localeCompare(b.package_id),
        );
        for (const scraper of scrapers) {
          const row = document.createElement("tr");

          const idCell = document.createElement("td");
          idCell.textContent = scraper.package_id;
          row.appendChild(idCell);

          const versionCell = document.createElement("td");
          versionCell.className = "apikey-cell";
          versionCell.textContent = scraper.version;
          row.appendChild(versionCell);

          const dateCell = document.createElement("td");
          dateCell.textContent = formatDate(scraper.date);
          row.appendChild(dateCell);

          const actionCell = document.createElement("td");
          actionCell.className = "d-flex gap-1";
          const available = scraper.source_package?.version;
          if (outdated(scraper)) {
            const updateBtn = document.createElement("button");
            updateBtn.className = "btn btn-sm btn-outline-primary";
            updateBtn.textContent = "Update";
            updateBtn.title = `Update to ${available} (${formatDate(scraper.source_package.date)})`;
            updateBtn.addEventListener("click", () =>
              postScraper(scraper.package_id, updateBtn, "Update"),
            );
            actionCell.appendChild(updateBtn);
          }
          const removeBtn = document.createElement("button");
          removeBtn.className = "btn btn-sm btn-outline-danger";
          removeBtn.textContent = "Remove";
          removeBtn.addEventListener("click", () =>
            removeScraper(scraper.package_id),
          );
          actionCell.appendChild(removeBtn);
          row.appendChild(actionCell);

          scraperTableBody.appendChild(row);
        }
      }

      function installScraper() {
        const auth = getAuth();
        if (!auth) {
          alert("Admin key is required.");
          return;
        }
        const idInput = document.getElementById("install-scraper-id");
        const id = idInput.value.trim();
        if (!id) {
          alert("Package ID is required.");
          return;
        }
        postScraper(id, document.getElementById("install-scraper"), "Install")
          .then(() => { idInput.value = ""; });
      }

      // installPackages also updates an already-installed package, so install and update share a request
      function postScraper(id, button, label) {
        const auth = getAuth();
        button.disabled = true;
        button.textContent = label === "Update" ? "Updating…" : "Installing…";
        return fetch(scraperURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth, id }),
        })
          .then(async (res) => {
            if (!res.ok)
              throw new Error(
                (await res.text()) || `Failed to ${label.toLowerCase()} scraper.`,
              );
            loadScrapers();
          })
          .catch((err) => alert(err.message))
          .finally(() => {
            button.disabled = false;
            button.textContent = label;
          });
      }

      function removeScraper(id) {
        if (!confirm(`Uninstall scraper package "${id}"?`)) return;
        const auth = getAuth();
        fetch(scraperURL, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth, id }),
        })
          .then(async (res) => {
            if (!res.ok)
              throw new Error(
                (await res.text()) || "Failed to uninstall scraper.",
              );
            loadScrapers();
          })
          .catch((err) => alert(err.message));
      }

      function createKey() {
        const auth = getAuth();
        if (!auth) {
          alert("Admin key is required.");
          return;
        }
        const note = document.getElementById("create-note").value.trim();
        const limitValue = document.getElementById("create-limit").value.trim();
        if (!note) {
          alert("Note / username is required.");
          return;
        }
        const data = { auth, note };
        if (limitValue) data.limit = Number(limitValue);

        fetch(apiURL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Failed to create API key.");
            return res.json();
          })
          .then(() => {
            document.getElementById("create-form").reset();
            loadKeys();
          })
          .catch((err) => alert(err.message));
      }

      function revokeKey(apikey, note) {
        if (
          !confirm(`Revoke API key for "${note}"? It can be reactivated later.`)
        )
          return;
        const auth = getAuth();
        fetch(apiURL, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth, key: apikey }),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Failed to revoke API key.");
            loadKeys();
          })
          .catch((err) => alert(err.message));
      }

      function reactivateKey(apikey, note) {
        if (!confirm(`Reactivate API key for "${note}"?`)) return;
        const auth = getAuth();
        fetch(`${apiURL}/reactivate`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ auth, key: apikey }),
        })
          .then((res) => {
            if (!res.ok) throw new Error("Failed to reactivate API key.");
            loadKeys();
          })
          .catch((err) => alert(err.message));
      }
    </script>
  </body>
</html>

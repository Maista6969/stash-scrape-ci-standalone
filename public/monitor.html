<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scraper monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/site.css" />
  </head>
  <body data-page="monitor" data-key>
    <script src="/assets/topbar.js"></script>
    <main>
      <section class="panel">
        <div id="toolbar" class="panel-head sticky">
          <div class="panel-tools">
            <h2 id="summary" class="panel-label">Monitored URLs</h2>
            <span id="chips" title="Click a status to show or hide it"></span>
          </div>
          <div class="panel-tools">
            <input id="filter" type="search" placeholder="Filter scraper, studio or URL" class="form-control form-control-sm" style="width: 240px" />
            <button id="expand-all" class="btn btn-sm btn-outline-secondary">Expand</button>
            <button id="collapse-all" class="btn btn-sm btn-outline-secondary">Collapse</button>
            <button id="refresh" class="btn btn-sm btn-outline-secondary">Refresh</button>
          </div>
        </div>
        <div id="groups" class="hint">Enter the admin key to load.</div>
      </section>

      <section class="panel">
        <div class="panel-head"><h2 class="panel-label">Add to the monitor</h2></div>
        <div class="row g-3">
          <div class="col-md-5">
            <label for="import-id" class="form-label small mb-1">Import a scraper's overview.md</label>
            <div class="input-group input-group-sm">
              <input id="import-id" type="text" placeholder="Package id, e.g. 1passforallsites" class="form-control" autocomplete="off" />
              <button id="import" class="btn btn-primary">Import</button>
            </div>
          </div>
          <div class="col-md-7">
            <label for="add-url" class="form-label small mb-1">Add a URL</label>
            <div class="input-group input-group-sm">
              <input id="add-url" type="url" placeholder="https://…" class="form-control" autocomplete="off" />
              <button id="add" class="btn btn-primary position-relative"><span>Add</span></button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2 id="coverage-summary" class="panel-label">Coverage</h2>
          <div class="panel-tools">
            <input id="coverage-filter" type="search" placeholder="Filter scraper or name" class="form-control form-control-sm" style="width: 240px" />
            <div class="form-check mb-0">
              <input id="importable-only" type="checkbox" class="form-check-input" />
              <label for="importable-only" class="form-check-label small">Has overview.md</label>
            </div>
          </div>
        </div>
        <div id="coverage" class="hint"></div>
      </section>
    </main>

    <script>
      const baseURL = window.location.origin;
      const monitorURL = `${baseURL}/api/admin/monitor`;

      const authInput = document.getElementById("admin-auth");
      const groupsEl = document.getElementById("groups");
      const filterInput = document.getElementById("filter");
      const chipsEl = document.getElementById("chips");
      // statuses shown; starts on what needs attention, the ok bulk is one click away
      const shownStatuses = new Set(["regressed", "error", "suspect"]);

      const STATUS = {
        regressed: { badge: "text-bg-warning", label: "Regressed" },
        suspect: { badge: "text-bg-primary", label: "Suspect" },
        error: { badge: "text-bg-danger", label: "Error" },
        running: { badge: "text-bg-info", label: "Running" },
        never: { badge: "text-bg-secondary", label: "Never scraped" },
        ok: { badge: "text-bg-success", label: "OK" },
        snoozed: { badge: "text-bg-secondary", label: "Snoozed" },
      };
      const SNOOZE_DAYS = [1, 7, 14];
      const isFailing = (u) => u.status === "regressed" || u.status === "error";
      // failing first, then suspect; a URL or group keeps the rank it had when first seen, so a
      // rescrape that fixes it shows in place instead of moving it down, until the page is reloaded
      const rank = (u) => (isFailing(u) ? 0 : u.status === "suspect" ? 1 : 2);
      const seenRank = new Map();
      // a URL stays visible under the chip it first appeared with, so a fix shows green in place
      const firstStatus = new Map();
      const isShown = (u) => shownStatuses.has(u.status) || shownStatuses.has(firstStatus.get(u.url));
      const stableRank = (key, r) => {
        if (!seenRank.has(key)) seenRank.set(key, r);
        return seenRank.get(key);
      };

      let entries = [];
      let packages = [];
      const openGroups = new Set();
      // kept outside the DOM so a spinner survives the reloads that rebuild every row
      const scraping = new Set();

      function getAuth() {
        return authInput.value.trim() || localStorage.getItem("auth");
      }

      function el(tag, props = {}, children = []) {
        const node = Object.assign(document.createElement(tag), props);
        for (const child of [].concat(children)) {
          if (child != null) node.append(child);
        }
        return node;
      }

      async function api(path, method, data) {
        const auth = getAuth();
        if (!auth) throw new Error("Admin key is required.");
        const res =
          method === "GET"
            ? await fetch(`${monitorURL}${path}?auth=${encodeURIComponent(auth)}`)
            : await fetch(`${monitorURL}${path}`, {
                method,
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ auth, ...data }),
              });
        if (!res.ok) throw new Error((await res.text()) || `Request failed (${res.status})`);
        return res.json();
      }

      document.addEventListener("DOMContentLoaded", () => {
        const storedAuth = localStorage.getItem("auth");
        if (storedAuth) {
          authInput.value = storedAuth;
          load();
        }
        document.getElementById("key-form").addEventListener("submit", (event) => {
          event.preventDefault();
          const auth = authInput.value.trim();
          if (!auth) {
            alert("Admin key is required.");
            return;
          }
          localStorage.setItem("auth", auth);
          load();
        });
        document.getElementById("refresh").addEventListener("click", load);
        document.getElementById("import").addEventListener("click", importOverview);
        document.getElementById("add").addEventListener("click", addUrl);
        for (const id of ["import-id", "add-url"]) {
          document.getElementById(id).addEventListener("keydown", (event) => {
            if (event.key !== "Enter") return;
            id === "import-id" ? importOverview() : addUrl();
          });
        }
        filterInput.addEventListener("input", render);
        document.getElementById("expand-all").addEventListener("click", () => {
          for (const d of groupsEl.querySelectorAll("details")) openGroups.add(d.dataset.scraperId);
          render();
        });
        document.getElementById("collapse-all").addEventListener("click", () => {
          openGroups.clear();
          render();
        });
        document.getElementById("coverage-filter").addEventListener("input", renderCoverage);
        document.getElementById("importable-only").addEventListener("change", renderCoverage);
      });

      function load() {
        loadUrls();
        api("/coverage", "GET")
          .then((data) => {
            packages = data;
            renderCoverage();
            // groups show a Reimport button once we know which scrapers have an overview.md
            render();
          })
          .catch((err) => alert(err.message));
      }

      function loadUrls() {
        api("", "GET")
          .then((data) => {
            entries = data;
            render();
          })
          .catch((err) => alert(err.message));
      }

      function render() {
        const query = filterInput.value.trim().toLowerCase();
        for (const u of entries) {
          stableRank(u.url, rank(u));
          if (!firstStatus.has(u.url)) firstStatus.set(u.url, u.status);
        }
        const groupRank = (id) => stableRank(`group:${id}`, Math.min(...entries.filter((u) => u.scraperId === id).map(rank)));
        const visible = entries.filter(
          (u) =>
            isShown(u) &&
            (!query ||
              [u.scraperId, u.studio, u.network, u.url].some((v) =>
                v?.toLowerCase().includes(query),
              )),
        );

        document.getElementById("summary").textContent = `Monitored URLs: ${entries.length}`;
        chipsEl.replaceChildren(
          ...Object.keys(STATUS)
            .map((s) => [s, entries.filter((u) => u.status === s).length])
            .filter(([s, n]) => n || shownStatuses.has(s))
            .map(([s, n]) => {
              const chip = el("span", {
                className: `badge ${STATUS[s].badge} ms-1${shownStatuses.has(s) ? "" : " off"}`,
                textContent: `${n} ${STATUS[s].label.toLowerCase()}`,
              });
              chip.addEventListener("click", () => {
                shownStatuses.has(s) ? shownStatuses.delete(s) : shownStatuses.add(s);
                render();
              });
              return chip;
            }),
        );

        const groups = new Map();
        for (const u of visible) {
          if (!groups.has(u.scraperId)) groups.set(u.scraperId, []);
          groups.get(u.scraperId).push(u);
        }

        groupsEl.innerHTML = "";
        groupsEl.className = "";
        if (!groups.size) {
          groupsEl.className = "text-secondary";
          groupsEl.textContent = entries.length
            ? "Nothing matches the filter or the selected statuses."
            : "Nothing monitored yet. Import a scraper's overview.md or add a URL below.";
          return;
        }

        // stable order: scraping a URL must not move it
        const sorted = [...groups.entries()].sort(([a], [b]) =>
          groupRank(a) - groupRank(b) || a.localeCompare(b),
        );
        for (const [scraperId, urls] of sorted) {
          groupsEl.append(renderGroup(scraperId, urls));
        }
      }

      function renderGroup(scraperId, urls) {
        urls.sort(
          (a, b) =>
            seenRank.get(a.url) - seenRank.get(b.url) ||
            (a.network ?? "").localeCompare(b.network ?? "") ||
            (a.studio ?? "").localeCompare(b.studio ?? "") ||
            a.url.localeCompare(b.url),
        );
        const counts = Object.keys(STATUS)
          .map((s) => [s, urls.filter((u) => u.status === s).length])
          .filter(([, n]) => n)
          .map(([s, n]) =>
            el("span", {
              className: `badge ${STATUS[s].badge} ms-1`,
              textContent: `${n} ${STATUS[s].label.toLowerCase()}`,
            }),
          );

        const details = el("details", { className: "group", open: openGroups.has(scraperId) });
        details.dataset.scraperId = scraperId;
        details.addEventListener("toggle", () =>
          details.open ? openGroups.add(scraperId) : openGroups.delete(scraperId),
        );
        // the whole scraper file, healthy URLs included, so a later failure stays quiet until the date
        const snoozeCtl = [
          urls.some((u) => isFailing(u) || u.suspect.length) ? snoozeSelect((days) => snooze({ scraperId }, days), "Snooze all…") : null,
          urls.some((u) => u.status === "snoozed") ? linkButton("Unsnooze all", () => snooze({ scraperId }, null)) : null,
        ];
        let reimportBtn = null;
        if (packages.some((p) => p.scraperId === scraperId && p.overview)) {
          reimportBtn = el("button", { className: "btn btn-link btn-sm py-0 ms-2 align-baseline link-secondary link-underline-opacity-0 link-underline-opacity-100-hover", textContent: "Reimport overview.md" });
          reimportBtn.addEventListener("click", (event) => {
            // a click inside <summary> would otherwise toggle the group
            event.preventDefault();
            document.getElementById("import-id").value = scraperId;
            importOverview();
          });
        }
        details.append(
          el("summary", {}, [
            el("span", { className: "chevron", textContent: "▸" }),
            el("span", { className: "group-name", textContent: scraperId }),
            el("span", { className: "text-secondary small ms-2", textContent: `${urls.length} URL${urls.length === 1 ? "" : "s"}` }),
            ...counts,
            ...snoozeCtl,
            reimportBtn,
          ]),
          el("div", { className: "table-responsive" },
            el("table", { className: "table table-sm align-middle mb-0" }, [
              el("thead", {},
                el("tr", {}, ["Studio", "URL", "Status", "Last scrape", ""].map((h) =>
                  el("th", { textContent: h }),
                )),
              ),
              el("tbody", {}, urls.map(renderRow)),
            ]),
          ),
        );
        return details;
      }

      function renderRow(u) {
        const status = STATUS[u.status];
        const statusCell = el("td", {}, el("span", { className: `badge ${status.badge}`, textContent: status.label }));
        if (u.missing.length) {
          statusCell.append(el("div", { className: "missing text-warning", textContent: `missing: ${u.missing.join(", ")}` }));
        }
        // a hint, not a failure: the scene may genuinely lack the field
        if (u.suspect.length) {
          const acceptBtn = el("button", { className: "btn btn-link btn-sm p-0 ms-1 align-baseline", textContent: "Accept", title: "This scene genuinely lacks these fields" });
          acceptBtn.addEventListener("click", () => acceptFields(u.url, u.suspect));
          statusCell.append(el("div", { className: "missing text-primary" }, [
            el("span", { textContent: `others have: ${u.suspect.join(", ")}` }),
            acceptBtn,
          ]));
        }
        if (u.status === "snoozed") {
          statusCell.append(el("div", { className: "small text-secondary" }, [
            el("span", { textContent: `until ${formatDate(u.snoozedUntil)}` }),
            linkButton("Unsnooze", () => snooze({ url: u.url }, null)),
          ]));
        } else if (isFailing(u) || u.suspect.length) {
          statusCell.append(snoozeSelect((days) => snooze({ url: u.url }, days), "Snooze…"));
        }
        if (u.latest?.error) {
          statusCell.append(el("div", { className: "small text-danger text-truncate", style: "max-width: 260px", title: u.latest.error, textContent: u.latest.error }));
        }
        // Stash dispatches overlapping URL patterns randomly, so a different scraper may have answered
        if (u.latest?.scraperId && u.latest.scraperId !== u.scraperId) {
          statusCell.append(el("div", { className: "small text-info", textContent: `scraped by ${u.latest.scraperId}` }));
        }

        const lastCell = el("td", { className: "small" });
        if (u.latest?.jobId) {
          lastCell.append(
            el("a", { href: `${baseURL}/scene?id=${u.latest.jobId}`, target: "_blank", rel: "noopener noreferrer", textContent: formatDate(u.latest.date) || u.latest.jobId }),
          );
        }

        const busy = scraping.has(u.url);
        const scrapeBtn = el("button", { className: "btn btn-sm btn-outline-primary position-relative", disabled: busy }, [
          // hidden label keeps the button's width so the table doesn't reflow
          el("span", { className: busy ? "invisible" : "", textContent: "Scrape" }),
          busy
            ? // flex centering: translate-middle's !important transform would cancel the spin animation
              el("span", { className: "position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" },
                el("span", { className: "spinner-border spinner-border-sm", role: "status", ariaLabel: "Scraping" }),
              )
            : null,
        ]);
        scrapeBtn.addEventListener("click", () => scrapeUrl(u.url));
        const removeBtn = el("button", { className: "btn btn-sm btn-outline-danger", textContent: "Remove" });
        removeBtn.addEventListener("click", () => removeUrl(u.url));

        return el("tr", {}, [
          el("td", {}, [
            u.network ? el("div", { className: "small text-secondary", textContent: u.network }) : null,
            u.studio || el("span", { className: "text-secondary", textContent: u.latest?.studio ?? "—" }),
          ]),
          el("td", { className: "url-cell" }, [
            el("a", { href: u.url, target: "_blank", rel: "noopener noreferrer", className: "text-truncate d-inline-block", textContent: u.url }),
            u.droppedFromOverview
              ? el("div", { className: "small text-warning", textContent: `no longer in ${u.overview}/overview.md` })
              : null,
          ]),
          statusCell,
          lastCell,
          el("td", { className: "text-nowrap" }, el("div", { className: "d-flex gap-1" }, [scrapeBtn, removeBtn])),
        ]);
      }

      // scene-by-URL scrapers in the repo with no monitored URL yet
      function renderCoverage() {
        const withUrls = packages.filter((p) => p.urls).length;
        const hosts = packages.reduce((n, p) => n + p.hosts, 0);
        const covered = packages.reduce((n, p) => n + p.coveredHosts, 0);
        document.getElementById("coverage-summary").textContent =
          `Coverage: ${withUrls} of ${packages.length} scrapers · ${covered} of ${hosts} domains`;

        const query = document.getElementById("coverage-filter").value.trim().toLowerCase();
        const importableOnly = document.getElementById("importable-only").checked;
        const missing = packages
          .filter((p) => !p.urls)
          .filter((p) => !importableOnly || p.overview)
          .filter((p) => !query || [p.scraperId, ...p.names].some((v) => v.toLowerCase().includes(query)))
          .sort((a, b) => a.scraperId.localeCompare(b.scraperId));

        const container = document.getElementById("coverage");
        if (!missing.length) {
          container.textContent = packages.some((p) => !p.urls) ? "Nothing matches the filter." : "Every scraper has at least one URL.";
          return;
        }
        container.replaceChildren(
          el("div", { className: "mb-2", textContent: `${missing.length} scrapers without URLs` }),
          el("div", { className: "table-responsive", style: "max-height: 480px" },
            el("table", { className: "table table-sm align-middle mb-0" }, [
              el("thead", {}, el("tr", {}, ["Scraper", "Domains", ""].map((h) => el("th", { textContent: h })))),
              el("tbody", {}, missing.map((p) => {
                const action = el("td", { className: "text-end text-nowrap" });
                if (p.overview) {
                  const button = el("button", { className: "btn btn-sm btn-outline-primary", textContent: "Import" });
                  button.addEventListener("click", () => {
                    document.getElementById("import-id").value = p.scraperId;
                    importOverview();
                  });
                  action.append(button);
                } else {
                  action.append(el("span", { className: "hint", textContent: "no overview.md, add a URL" }));
                }
                const names = p.names.filter((n) => n !== p.scraperId);
                return el("tr", {}, [
                  el("td", {}, [
                    el("span", { className: "group-name", textContent: p.scraperId }),
                    names.length ? el("span", { className: "text-secondary ms-2", textContent: names.join(", ") }) : null,
                  ]),
                  el("td", { textContent: p.hosts }),
                  action,
                ]);
              })),
            ]),
          ),
        );
      }

      function importOverview() {
        const input = document.getElementById("import-id");
        const id = input.value.trim();
        if (!id) return alert("Package ID is required.");
        const button = document.getElementById("import");
        button.disabled = true;
        api("/import", "POST", { id })
          .then(({ found, added, dropped }) => {
            input.value = "";
            openGroups.add(id);
            alert(`${id}: ${found} URLs in overview.md, ${added} new` + (dropped ? `, ${dropped} no longer listed (flagged, not removed).` : "."));
            load();
          })
          .catch((err) => alert(err.message))
          .finally(() => (button.disabled = false));
      }

      function addUrl() {
        const urlInput = document.getElementById("add-url");
        const url = urlInput.value.trim();
        if (!url) return alert("URL is required.");
        const addBtn = document.getElementById("add");
        // the request also runs the first scrape, so show it as busy without changing the button's width
        addBtn.disabled = true;
        addBtn.firstChild.classList.add("invisible");
        const spinner = el("span", { className: "position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center" },
          el("span", { className: "spinner-border spinner-border-sm", role: "status", ariaLabel: "Adding" }),
        );
        addBtn.append(spinner);
        api("/url", "POST", { url })
          .then(({ added, scraperId, overlap }) => {
            if (!added) alert("That URL is already monitored.");
            if (overlap) alert(`Several scrapers match this URL (${overlap.join(", ")}); Stash will pick one at random. Filed under ${scraperId}.`);
            urlInput.value = "";
            openGroups.add(scraperId);
            load();
          })
          .catch((err) => alert(err.message))
          .finally(() => {
            spinner.remove();
            addBtn.firstChild.classList.remove("invisible");
            addBtn.disabled = false;
          });
      }

      function linkButton(text, onClick) {
        const btn = el("button", { className: "btn btn-link btn-sm p-0 ms-1 align-baseline", textContent: text });
        btn.addEventListener("click", (event) => {
          // a click inside <summary> would otherwise toggle the group
          event.preventDefault();
          onClick();
        });
        return btn;
      }

      // a native select: Bootstrap's dropdown JS isn't loaded, and it works inside <summary>
      function snoozeSelect(onPick, placeholder) {
        const select = el("select", { className: "form-select form-select-sm w-auto d-inline-block ms-1 py-0", title: "Hide this failure for a while; scraping continues" }, [
          el("option", { value: "", textContent: placeholder, selected: true }),
          ...SNOOZE_DAYS.map((d) => el("option", { value: String(d), textContent: `${d}d` })),
          el("option", { value: "custom", textContent: "Custom…" }),
        ]);
        select.addEventListener("click", (event) => event.preventDefault());
        select.addEventListener("change", () => {
          const value = select.value;
          select.value = "";
          const days = value === "custom" ? Number(prompt("Snooze for how many days?", "30")) : Number(value);
          if (days > 0) onPick(days);
        });
        return select;
      }

      // target is { url } or { scraperId }; days null lifts the snooze
      function snooze(target, days) {
        const until = days === null ? null : new Date(Date.now() + days * 86_400_000).toISOString();
        api("/snooze", "POST", { ...target, until })
          .then(loadUrls)
          .catch((err) => alert(err.message));
      }

      function acceptFields(url, fields) {
        if (!confirm(`Stop expecting ${fields.join(", ")} for ${url}?`)) return;
        api("/accept", "POST", { url, fields })
          .then(loadUrls)
          .catch((err) => alert(err.message));
      }

      function removeUrl(url) {
        if (!confirm(`Stop monitoring ${url}?\nIts baseline is discarded; past scrapes are kept.`)) return;
        api("/url", "DELETE", { url })
          .then(load)
          .catch((err) => alert(err.message));
      }

      function scrapeUrl(url) {
        scraping.add(url);
        render();
        api("/scrape", "POST", { url })
          .catch((err) => alert(err.message))
          .finally(() => {
            scraping.delete(url);
            loadUrls();
          });
      }
    </script>
  </body>
</html>

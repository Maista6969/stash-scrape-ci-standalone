<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scrape a scene</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/assets/site.css">
</head>
<body data-page="upload">
  <script src="/assets/topbar.js"></script>
  <main class="narrow">
    <section class="panel">
      <div class="panel-head"><h2 class="panel-label">Scrape a scene</h2></div>
      <form id="scrape-form" class="vstack gap-2">
        <input id="scrape-url" type="text" placeholder="Scene URL" class="form-control" required autocomplete="off">
        <div class="d-flex gap-2">
          <select id="scrape-type" class="form-select" style="width: 10rem" required autocomplete="off">
            <option value="scene">Scene</option>
          </select>
          <input id="scrape-auth" type="password" placeholder="API key" class="form-control" autocomplete="off">
        </div>
        <div class="form-check">
          <input id="scrape-rescrape" type="checkbox" class="form-check-input" value="">
          <label class="form-check-label" for="scrape-rescrape">Re-scrape even if a result is cached</label>
        </div>
        <div class="d-flex justify-content-between">
          <button type="submit" class="btn btn-primary">Scrape</button>
          <button type="button" id="update-scrapers" class="btn btn-outline-secondary">Update scrapers</button>
        </div>
      </form>
    </section>

    <section id="update-result-card" class="panel d-none">
      <div class="panel-head"><h2 class="panel-label">Scraper update</h2></div>
      <div id="update-result"></div>
    </section>

    <section class="panel">
      <div class="panel-head"><h2 class="panel-label">Results</h2></div>
      <ul id="scrape-result-list" class="list-group list-group-flush"></ul>
    </section>
  </main>

  <script>
    const baseURL = window.location.origin;
    const apiURL = `${baseURL}/api/scrape`;

    document.addEventListener('DOMContentLoaded', () => {
      const authInput = document.getElementById('scrape-auth');
      const storedAuth = localStorage.getItem('auth');
      if (storedAuth) authInput.value = storedAuth;

      document.getElementById('scrape-form').addEventListener('submit', event => {
        event.preventDefault();
        submitScrape();
      });

      document.getElementById('update-scrapers').addEventListener('click', () => {
        const auth = authInput.value.trim() || localStorage.getItem('auth');
        if (!auth) {
          showUpdateResult('You must be logged in to update scrapers.', true);
          return;
        }
        localStorage.setItem('auth', auth);
        const button = document.getElementById('update-scrapers');
        button.disabled = true;
        button.textContent = 'Updating…';
        fetch(`${baseURL}/api/update`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ auth })
        })
        .then(async res => {
          const text = await res.text();
          let body = null;
          try { body = JSON.parse(text); } catch {}
          if (!res.ok) throw new Error(text || `Failed to update scrapers (${res.status}).`);
          showUpdateDiff(body.updated);
        })
        .catch(err => showUpdateResult(err.message, true))
        .finally(() => {
          button.disabled = false;
          button.textContent = 'Update scrapers';
        });
      });
    });

    function submitScrape() {
      const url = document.getElementById('scrape-url').value.trim();
      const rescrape = document.getElementById('scrape-rescrape').checked;
      const scrapeType = document.getElementById('scrape-type').value;
      const auth = document.getElementById('scrape-auth').value.trim();

      if (!url || !scrapeType) {
        alert('Please fill out all required fields.');
        return;
      }

      const authKey = auth || localStorage.getItem('auth');
      if (!authKey) {
        alert('Authentication required.');
        return;
      }
      localStorage.setItem('auth', authKey);

      const data = { url, scrapeType, auth: authKey, async: true };
      if (rescrape) {
        data.rescrape = true;
      }

      fetch(apiURL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      })
      .then(async res => {
        // error responses are either plain text or { error } JSON — surface
        // the real message instead of a generic failure
        const text = await res.text();
        let body = null;
        try { body = JSON.parse(text); } catch {}
        if (!res.ok) throw new Error(body?.error || text || `Failed to submit scrape (${res.status}).`);
        return body;
      })
      .then(data => {
        if (!data?.jobId) return;
        const item = addResultItem(data.jobId, scrapeType);
        if (data.pending) {
          setItemStatus(item, 'running…');
          pollResult(data.jobId, item);
        } else {
          // synchronous 200 means the cache already had a finished result
          setItemStatus(item, `done (cached) — ${data.result?.title ?? 'no title'}`);
        }
      })
      .catch(err => alert(err.message));
    }

    function addResultItem(jobId, scrapeType) {
      const list = document.getElementById('scrape-result-list');
      const item = document.createElement('li');
      item.className = 'list-group-item';
      const link = document.createElement('a');
      link.href = `${baseURL}/${scrapeType}?id=${jobId}`;
      link.target = '_blank';
      link.textContent = jobId;
      const status = document.createElement('span');
      status.className = 'ms-2 text-muted';
      item.append('Job ID: ', link, status);
      list.prepend(item);
      return item;
    }

    function setItemStatus(item, text) {
      item.querySelector('span').textContent = `— ${text}`;
    }

    function showUpdateResult(message, isError = false) {
      document.getElementById('update-result-card').classList.remove('d-none');
      const container = document.getElementById('update-result');
      container.textContent = message;
      container.className = isError ? 'text-danger' : '';
      return container;
    }

    function showUpdateDiff(updated) {
      if (!updated?.length) {
        showUpdateResult('Scrapers updated — no version changes.');
        return;
      }
      const container = showUpdateResult(`Scrapers updated — ${updated.length} changed:`);
      const list = document.createElement('ul');
      list.className = 'mb-0';
      for (const update of updated) {
        const item = document.createElement('li');
        item.textContent = `${update.package_id}: ${(update.before ?? 'new').slice(0, 7)} → ${update.after.slice(0, 7)}`;
        list.appendChild(item);
      }
      container.appendChild(list);
    }

    function pollResult(jobId, item) {
      const started = Date.now();
      const interval = setInterval(async () => {
        if (Date.now() - started > 5 * 60 * 1000) {
          clearInterval(interval);
          setItemStatus(item, 'still running after 5 minutes — check the result page later');
          return;
        }
        try {
          const res = await fetch(`${baseURL}/api/result/${jobId}`);
          if (!res.ok) return;
          const data = await res.json();
          if (data.pending) return;
          clearInterval(interval);
          setItemStatus(item, data.error ? `failed — ${data.error}` : `done — ${data.result?.title ?? 'no title'}`);
        } catch {} // transient network errors: keep polling
      }, 3000);
    }
  </script>
</body>
</html>
